[project]
name = "icm-2026"
version = "0.1.0"
authors = [
    { name = "Ayush Kumar", email = "github@ayukmr.com" }
]
dependencies = [
    "scikit-learn>=1.8.0",
    "unidecode>=1.4.0",
]
requires-python = ">= 3.8"

[project.scripts]
impact = "icm_2026.impact:main"
trades = "icm_2026.trades:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = []

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/icm_2026"]

[tool.pyright]
venvPath = "."
venv = ".venv"
